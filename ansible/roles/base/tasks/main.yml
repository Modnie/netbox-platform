---
- name: Install base system packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure system timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Enable and start QEMU guest agent
  ansible.builtin.service:
    name: qemu-guest-agent
    enabled: true
    state: started
