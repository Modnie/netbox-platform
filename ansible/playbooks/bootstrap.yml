---
- name: Bootstrap NetBox server
  hosts: netbox_servers
  become: true

  tasks:
    - name: Install QEMU guest agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true

    - name: Enable and start QEMU guest agent
      ansible.builtin.service:
        name: qemu-guest-agent
        enabled: true
        state: started
